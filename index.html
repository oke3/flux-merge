<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flux Merge</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      #game-container {
        position: relative;
        width: 600px;
        height: 600px;
      }

      canvas {
        display: block;
        border-radius: 12px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
      }

      .overlay {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 12px 24px;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }

      .score-display {
        font-size: 24px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal {
        pointer-events: auto;
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }

      .btn {
        margin-top: 20px;
        padding: 12px 32px;
        background: white;
        color: #0f0f1a;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }

      /* Intro Screen Styles */
      #intro-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 15, 26, 0.85);
        backdrop-filter: blur(15px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transition: opacity 1s ease, visibility 1s;
        text-align: center;
      }

      #intro-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .intro-title {
        font-size: 64px;
        font-weight: 900;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin: 0;
        background: linear-gradient(to bottom, #fff, #888);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
      }

      .intro-subtitle {
        font-size: 18px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 40px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas" width="600" height="600"></canvas>
      
      <div id="intro-screen">
        <h1 class="intro-title">FLUX MERGE</h1>
        <p class="intro-subtitle">Harness the Energy. Reach the Singularity.</p>
        <button class="btn" id="startBtn">Begin Awakening</button>
      </div>

      <div class="overlay">
        <div class="glass-panel score-display">
          Score: <span id="scoreValue">0</span>
        </div>
      </div>

      <div id="ui-overlay">
        <div id="gameOverModal" class="glass-panel modal">
          <h1>Grid Full!</h1>
          <p>The singularity was just out of reach.</p>
          <button class="btn" onclick="location.reload()">Retry</button>
        </div>
        <div id="winModal" class="glass-panel modal">
          <h1>Singularity Achieved!</h1>
          <p>You have merged the cosmos.</p>
          <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
